<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка смен — дашборд</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f25; --panel2:#22262d; --line:#2e333c;
    --ink:#e8eaf0; --dim:#9aa1ad; --faint:#6b7280;
    --ok:#3ecf8e; --warn:#e5b455; --bad:#e5655f; --accent:#5b9dff;
    --okbg:rgba(62,207,142,.13); --warnbg:rgba(229,180,85,.13); --badbg:rgba(229,101,95,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1420px;margin:0 auto;padding:24px 24px 60px}
  .banner{background:linear-gradient(90deg,rgba(91,157,255,.12),rgba(91,157,255,.03));
    border:1px solid rgba(91,157,255,.4);border-radius:10px;padding:10px 16px;margin-bottom:18px;
    color:var(--dim);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dot-live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  .dot-off{width:9px;height:9px;border-radius:50%;background:var(--warn)}
  @keyframes pulse{50%{opacity:.4}}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:26px;font-weight:650}
  .week{color:var(--accent);font-weight:600;font-size:14px;border:1px solid var(--accent);border-radius:6px;padding:2px 10px}
  .sub{color:var(--faint);font-size:13px;margin-left:auto}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;
    padding:8px 20px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .cnt{opacity:.75;font-weight:400;margin-left:6px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .tile .n{font-size:32px;font-weight:700;line-height:1}
  .tile .l{color:var(--dim);font-size:12.5px;margin-top:6px}
  .tile.ok .n{color:var(--ok)} .tile.warn .n{color:var(--warn)} .tile.bad .n{color:var(--bad)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card h2{font-size:14px;color:var(--dim);font-weight:600;margin-bottom:14px}
  .bar-row{display:grid;grid-template-columns:200px 1fr 36px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
  .bar-row .lbl{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{background:var(--panel2);border-radius:5px;height:16px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .5s}
  .val{color:var(--ink);font-weight:600;text-align:right}
  .stacks{display:flex;align-items:flex-end;gap:26px;height:170px;padding:0 8px}
  .stcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dim);height:100%;justify-content:flex-end}
  .stcol .stack{width:52px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden;flex:1}
  .stcol .sum{font-weight:700;color:var(--ink);font-size:14px}
  .seg-bad{background:var(--bad)} .seg-warn{background:var(--warn)} .seg-ok{background:var(--ok)}
  .lgt{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .lgt i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;font-style:normal}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .filters select,.filters input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px 10px;font:inherit;font-size:13px}
  .filters input{width:220px}
  .filters label{color:var(--dim);font-size:12.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .count{color:var(--faint);font-size:12.5px;margin-left:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--faint);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;white-space:nowrap}
  td{padding:8px;border-bottom:1px solid var(--line)}
  tr.r:hover td{background:var(--panel2);cursor:pointer}
  tr.detail td{background:#191c21;padding:0}
  .detail-in{padding:14px 18px 18px;display:none}
  tr.detail.open .detail-in{display:block}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
  @media(max-width:900px){.dgrid{grid-template-columns:1fr}}
  .drow{border-bottom:1px dashed var(--line);padding:6px 0;font-size:12.5px}
  .drow b{color:var(--dim);font-weight:600;display:block;font-size:11.5px;margin-bottom:2px}
  .drow span{color:var(--ink);line-height:1.5}
  .chip{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .c-bad{background:var(--badbg);color:var(--bad)} .c-ok{background:var(--okbg);color:var(--ok)}
  .c-wip{background:rgba(91,157,255,.13);color:var(--accent)} .c-warn{background:var(--warnbg);color:var(--warn)}
  .score-ok{color:var(--ok);font-weight:700} .score-bad{color:var(--bad);font-weight:700} .score-warn{color:var(--warn);font-weight:700}
  .note{margin-top:18px;color:var(--faint);font-size:12px}
  .empty{color:var(--faint);font-size:13px;padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner"><span class="dot-off" id="livedot"></span><span id="livetext">Загрузка…</span>
    <button id="refresh" style="margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px 14px;cursor:pointer;font:inherit">⟳ Обновить</button>
  </div>
  <header>
    <h1>Проверка смен — дашборд</h1>
    <span class="week" id="weeklabel"></span>
    <span class="sub" id="updated"></span>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <p class="note">Данные: Google-таблица «продюсеры» (приватная) → Apps Script (доступ только по ключу) → этот дашборд. Обновление каждые 5 минут.</p>
</div>

<script>
// ================== НАСТРОЙКИ ==================
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwXyvc0OXUa27Rb9rbJHn7t26Yssqtndjf87rk25_IlrWYRofYTieVGjAU6-u33GHw/exec",
  API_KEY: "",   // из ссылки (?key=...) или localStorage
  REFRESH_MIN: 5
};
(function(){
  const p = new URLSearchParams(location.search).get("key");
  if (p) localStorage.setItem("dash_key", p);
})();
CONFIG.API_KEY = localStorage.getItem("dash_key") || "";

const CATS = ["Работа с ОКО","Общение с моделью","Общение с мемберами","Работа с голами","Шоу / плейлист","Работа с сайтами / раскладка","Кадр / картинка","Комната"];
const CITIES = ["Обзор","Томск","Новосибирск","Онлайн"];
const OK_RE = /(^|[\s,.!?])(все хорошо|все отлично|все нравится|работа есть|работает хорошо|нравится)/i;
const NEG_RE = /\b(не|нет)\s/i;

const state = { tab:"Обзор", producer:"", onlyBad:false, sort:"worst", rows:[], open:{} };

// ---- эвристика: категория ок / проблема / не оценивалась
function catState(t){
  const s = (t||"").trim();
  if (!s) return null;
  if (s.charAt(0) === "✅") return "ok";
  if (OK_RE.test(s) && !NEG_RE.test(s)) return "ok";
  return "bad";
}
function rowStats(r){
  const st = r.cats.map(catState);
  const ok = st.filter(x=>x==="ok").length;
  const bad = st.filter(x=>x==="bad").length;
  const evalN = st.filter(x=>x!==null).length;
  let score = null, verdict = "";
  if (evalN > 0){
    score = ok;
    verdict = bad === 0 ? "норма" : bad <= 2 ? "замечание" : "критично";
    if (r.verdict && r.verdict !== "—") verdict = r.verdict; // если в таблице задан явно
    if (r.score && /\/8/.test(r.score)) score = parseInt(r.score) || 0;
  }
  return {st, ok, bad, score, verdict};
}
const scoreCls = n => n>=6 ? "score-ok" : n>=3 ? "score-warn" : "score-bad";
const chipCls = {"норма":"c-ok","замечание":"c-warn","критично":"c-bad","ново":"c-bad","в работе":"c-wip","исправлено":"c-ok","—":"c-warn"};
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function rowsOf(tab){ return tab==="Обзор" ? state.rows : state.rows.filter(r=>r.city===tab); }

function render(){
  // вкладки
  document.getElementById("tabs").innerHTML = CITIES.map(c=>{
    const n = rowsOf(c).length;
    return `<button class="tab ${state.tab===c?"on":""}" data-t="${c}">${c}<span class="cnt">${n||""}</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;render();});

  const rows = rowsOf(state.tab);
  const st = rows.map(rowStats);
  const withScore = st.filter(x=>x.score!==null);
  document.getElementById("weeklabel").textContent = [...new Set(rows.map(r=>r.week).filter(Boolean))].join(" · ") || "—";

  // фильтры
  const prods = [...new Set(rows.map(r=>r.producer).filter(Boolean))].sort();
  const sel = `<select id="f-prod"><option value="">все продюсеры</option>${prods.map(p=>`<option ${state.producer===p?"selected":""}>${esc(p)}</option>`).join("")}</select>`;
  const html = `
    <div class="tiles">
      <div class="tile"><div class="n">${rows.length}</div><div class="l">смен проверено</div></div>
      <div class="tile ok"><div class="n">${withScore.filter(x=>x.verdict==="норма").length}</div><div class="l">в норме</div></div>
      <div class="tile warn"><div class="n">${withScore.filter(x=>x.verdict==="замечание").length}</div><div class="l">есть замечания</div></div>
      <div class="tile bad"><div class="n">${withScore.filter(x=>x.verdict==="критично").length}</div><div class="l">критично</div></div>
      <div class="tile"><div class="n">${withScore.length?Math.round(withScore.reduce((a,x)=>a+x.score,0)/withScore.length*12.5)+"%":"–"}</div><div class="l">средняя оценка</div></div>
    </div>
    <div class="grid">
      <div class="card"><h2>Топ проблем по категориям</h2><div id="cats"></div></div>
      ${state.tab==="Обзор" ? '<div class="card"><h2>Города: норма / замечание / критично</h2><div class="stacks" id="stacks"></div><div class="lgt"><span><i class="seg-ok"></i>норма</span><span><i class="seg-warn"></i>замечание</span><span><i class="seg-bad"></i>критично</span></div></div>'
                            : '<div class="card"><h2>Вердикты</h2><div id="donut"></div></div>'}
    </div>
    <div class="card">
      <h2>Смены</h2>
      <div class="filters">${sel}
        <label><input type="checkbox" id="f-bad" ${state.onlyBad?"checked":""}> только проблемные</label>
        <span class="count" id="f-count"></span>
      </div>
      <div id="table"></div>
    </div>`;
  document.getElementById("content").innerHTML = html;
  document.getElementById("f-prod").onchange = e=>{state.producer=e.target.value;render();};
  document.getElementById("f-bad").onchange = e=>{state.onlyBad=e.target.checked;render();};

  // топ проблем
  const catCounts = CATS.map((n,i)=>({n, c: rows.filter(r=>rowStats(r).st[i]==="bad").length}));
  catCounts.sort((a,b)=>b.c-a.c);
  const mx = Math.max(1,...catCounts.map(x=>x.c));
  document.getElementById("cats").innerHTML = catCounts.map(x=>
    `<div class="bar-row"><span class="lbl">${x.n}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.c/mx*100)}%;background:${x.c>=mx*0.8?"var(--bad)":x.c>=mx*0.4?"#d67f42":"var(--ok)"}"></div></div><span class="val">${x.c}</span></div>`).join("");

  // графики
  if (state.tab==="Обзор"){
    const cities = CITIES.slice(1);
    const counts = cities.map(c=>({
      c,
      ok: st.filter((x,i)=>rows[i].city===c&&x.verdict==="норма").length,
      warn: st.filter((x,i)=>rows[i].city===c&&x.verdict==="замечание").length,
      bad: st.filter((x,i)=>rows[i].city===c&&x.verdict==="критично").length
    }));
    const tot = Math.max(1,...counts.map(x=>x.ok+x.warn+x.bad));
    document.getElementById("stacks").innerHTML = counts.map(x=>{
      const h = v=>Math.round(v/tot*100)+"%";
      return `<div class="stcol"><span class="sum">${x.ok+x.warn+x.bad}</span><div class="stack">
        <div class="seg-bad" style="height:${h(x.bad)}"></div><div class="seg-warn" style="height:${h(x.warn)}"></div><div class="seg-ok" style="height:${h(x.ok)}"></div></div><span>${x.c==="Новосибирск"?"НСК":x.c}</span></div>`;
    }).join("");
  } else {
    const segs = ["критично","замечание","норма"].map(v=>({v,n:withScore.filter(x=>x.verdict===v).length,
      color:v==="норма"?"var(--ok)":v==="замечание"?"var(--warn)":"var(--bad)"})).filter(x=>x.n);
    const tot = segs.reduce((a,s)=>a+s.n,0)||1;
    let acc=0;
    const svg = `<svg class="dyn" width="190" height="190" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="15.9" fill="none" stroke="#22262d" stroke-width="6"></circle>
      ${segs.map(s=>{const f=s.n/tot*100;const o=acc;acc+=f;
        return `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${s.color}" stroke-width="6" stroke-dasharray="${f.toFixed(2)} ${(100-f).toFixed(2)}" stroke-dashoffset="${(-o).toFixed(2)}" transform="rotate(-90 21 21)"></circle>`;}).join("")}
      <text x="21" y="20.5" text-anchor="middle" fill="#e8eaf0" font-size="7" font-weight="700">${tot}</text>
      <text x="21" y="26.5" text-anchor="middle" fill="#6b7280" font-size="3.2">смен</text></svg>`;
    document.getElementById("donut").innerHTML = svg +
      `<div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--dim)">${segs.map(s=>`<div><span class="dot" style="background:${s.color}"></span> ${s.v}: <b style="color:var(--ink)">${s.n}</b></div>`).join("")}</div>`;
  }

  // таблица
  let view = rows.map((r,i)=>({r, s:st[i]}));
  if (state.producer) view = view.filter(x=>x.r.producer===state.producer);
  if (state.onlyBad) view = view.filter(x=>x.s.verdict==="критично" || x.s.verdict==="замечание");
  view.sort((a,b)=>(a.s.score??99)-(b.s.score??99));
  document.getElementById("f-count").textContent = "показано " + view.length + " из " + rows.length;

  document.getElementById("table").innerHTML = view.length ? `<table>
    <thead><tr><th>Продюсер</th><th>Опер</th><th>Модель</th>${state.tab==="Обзор"?"<th>Город</th>":""}<th>Оценка</th><th>Вердикт</th><th>Статус</th></tr></thead><tbody>${
    view.map((x,i)=>{
      const key = view.indexOf(x);
      const det = CATS.map((n,j)=>{
        const t = (x.r.cats[j]||"").trim();
        if (!t) return "";
        const mark = x.s.st[j]==="ok" ? "✅" : x.s.st[j]==="bad" ? "❌" : "·";
        return `<div class="drow"><b>${mark} ${n}</b><span>${esc(t)}</span></div>`;
      }).join("");
      const extra = [x.r.obs ? `<div class="drow"><b>💬 Доп. комментарий</b><span>${esc(x.r.obs)}</span></div>` : "",
                     x.r.rec && x.r.rec!=="—" ? `<div class="drow"><b>➜ Рекомендация</b><span>${esc(x.r.rec)}</span></div>` : ""].join("");
      return `<tr class="r" data-i="${key}"><td>${esc(x.r.producer||"—")}</td><td>${esc(x.r.opName||x.r.opNick||"")}${x.r.opNick&&x.r.opName?` <span style="color:var(--faint);font-size:11px">(${esc(x.r.opNick)})</span>`:""}</td><td>${esc(x.r.model||"")}</td>${state.tab==="Обзор"?`<td style="color:var(--dim)">${esc(x.r.city)}</td>`:""}<td class="${scoreCls(x.s.score??0)}">${x.s.score!==null?x.s.score+"/8":"–"}</td><td>${x.s.verdict?`<span class="chip ${chipCls[x.s.verdict]}">${x.s.verdict}</span>`:""}</td><td>${x.r.status?`<span class="chip ${chipCls[x.r.status]||"c-warn"}">${esc(x.r.status)}</span>`:""}</td></tr>
      <tr class="detail" data-d="${key}"><td colspan="8"><div class="detail-in"><div class="dgrid">${det}${extra}</div></div></td></tr>`;
    }).join("")}</tbody></table>` : `<div class="empty">Нет данных по фильтру</div>`;

  document.querySelectorAll("tr.r").forEach(tr=>tr.onclick=()=>{
    document.querySelector(`tr.detail[data-d="${tr.dataset.i}"]`).classList.toggle("open");
  });
}

function jsonp(){
  return new Promise((resolve,reject)=>{
    const cb="__dashcb_"+Math.random().toString(36).slice(2);
    window[cb]=d=>{resolve(d);cleanup();};
    const s=document.createElement("script");
    s.src=CONFIG.API_URL+"?key="+encodeURIComponent(CONFIG.API_KEY)+"&callback="+cb;
    s.onerror=()=>{reject(new Error("не удалось загрузить данные"));cleanup();};
    function cleanup(){delete window[cb];s.remove();}
    document.head.appendChild(s);
  });
}
async function load(){
  const dot=document.getElementById("livedot"),txt=document.getElementById("livetext");
  if(!CONFIG.API_KEY){
    const k=prompt("Введи ключ доступа к дашборду:");
    if(k){localStorage.setItem("dash_key",k);CONFIG.API_KEY=k;}
    else{dot.className="dot-off";txt.textContent="Нет ключа — данные не загружаются.";return;}
  }
  try{
    const j=await jsonp();
    if(j.error)throw new Error(j.error);
    state.rows=(j.rows||[]).filter(r=>r.opName||r.model||r.cats.some(c=>(c||"").trim()));
    dot.className="dot-live";
    txt.textContent="Живые данные из Google-таблицы · обновлено "+new Date().toLocaleTimeString("ru-RU");
    document.getElementById("updated").textContent="источник: таблица «продюсеры»";
    render();
  }catch(e){
    dot.className="dot-off";
    txt.textContent="Ошибка загрузки: "+e.message+". Возможно, нужно войти в Google-аккаунт в этом браузере.";
  }
}
document.getElementById("refresh").onclick=load;
load();
setInterval(load,CONFIG.REFRESH_MIN*60*1000);
</script>
</body>
</html>
