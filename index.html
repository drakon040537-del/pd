<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка смен — дашборд</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f25; --panel2:#22262d; --line:#2e333c;
    --ink:#e8eaf0; --dim:#9aa1ad; --faint:#6b7280;
    --ok:#3ecf8e; --warn:#e5b455; --bad:#e5655f; --accent:#5b9dff;
    --okbg:rgba(62,207,142,.13); --warnbg:rgba(229,180,85,.13); --badbg:rgba(229,101,95,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1420px;margin:0 auto;padding:24px 24px 60px}
  .banner{background:linear-gradient(90deg,rgba(91,157,255,.12),rgba(91,157,255,.03));
    border:1px solid rgba(91,157,255,.4);border-radius:10px;padding:10px 16px;margin-bottom:18px;
    color:var(--dim);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dot-live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  .dot-off{width:9px;height:9px;border-radius:50%;background:var(--warn)}
  @keyframes pulse{50%{opacity:.4}}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:26px;font-weight:650}
  .week{color:var(--accent);font-weight:600;font-size:14px;border:1px solid var(--accent);border-radius:6px;padding:2px 10px}
  .sub{color:var(--faint);font-size:13px;margin-left:auto}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;
    padding:8px 20px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .cnt{opacity:.75;font-weight:400;margin-left:6px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .tile .n{font-size:32px;font-weight:700;line-height:1}
  .tile .l{color:var(--dim);font-size:12.5px;margin-top:6px}
  .tile.ok .n{color:var(--ok)} .tile.warn .n{color:var(--warn)} .tile.bad .n{color:var(--bad)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card h2{font-size:14px;color:var(--dim);font-weight:600;margin-bottom:14px}
  .bar-row{display:grid;grid-template-columns:200px 1fr 36px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
  .bar-row .lbl{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{background:var(--panel2);border-radius:5px;height:16px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .5s}
  .val{color:var(--ink);font-weight:600;text-align:right}
  .stacks{display:flex;align-items:flex-end;gap:26px;height:170px;padding:0 8px}
  .stcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dim);height:100%;justify-content:flex-end}
  .stcol .stack{width:52px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden;flex:1}
  .stcol .sum{font-weight:700;color:var(--ink);font-size:14px}
  .seg-bad{background:var(--bad)} .seg-warn{background:var(--warn)} .seg-ok{background:var(--ok)}
  .lgt{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .lgt i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;font-style:normal}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .filters select,.filters input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px 10px;font:inherit;font-size:13px}
  .filters input{width:220px}
  .filters label{color:var(--dim);font-size:12.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .count{color:var(--faint);font-size:12.5px;margin-left:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--faint);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;white-space:nowrap}
  td{padding:8px;border-bottom:1px solid var(--line)}
  tr.r:hover td{background:var(--panel2);cursor:pointer}
  tr.detail td{background:#191c21;padding:0}
  .detail-in{padding:14px 18px 18px;display:none}
  tr.detail.open .detail-in{display:block}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
  @media(max-width:900px){.dgrid{grid-template-columns:1fr}}
  .drow{border-bottom:1px dashed var(--line);padding:6px 0;font-size:12.5px}
  .drow b{color:var(--dim);font-weight:600;display:block;font-size:11.5px;margin-bottom:2px}
  .drow span{color:var(--ink);line-height:1.5}
  .chip{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .c-bad{background:var(--badbg);color:var(--bad)} .c-ok{background:var(--okbg);color:var(--ok)}
  .c-wip{background:rgba(91,157,255,.13);color:var(--accent)} .c-warn{background:var(--warnbg);color:var(--warn)}
  .score-ok{color:var(--ok);font-weight:700} .score-bad{color:var(--bad);font-weight:700} .score-warn{color:var(--warn);font-weight:700}
  .note{margin-top:18px;color:var(--faint);font-size:12px}
  .empty{color:var(--faint);font-size:13px;padding:10px 0}

  .qbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px}
  .qbtn:hover{color:var(--ink)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
  @media(max-width:900px){.edit-grid{grid-template-columns:1fr}}
  .edit-grid .f{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .edit-grid .f b{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:11.5px;font-weight:600;margin-bottom:5px}
  .edit-grid textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px;min-height:54px;resize:vertical;box-sizing:border-box}
  .edit-grid select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
  .savebtn{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:9px 22px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
  .savebtn:disabled{opacity:.5}
  .addform{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .addform.show{display:block}
  .addform .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
  .addform input,.addform select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px;box-sizing:border-box}
  .abtn{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 20px;font:inherit;font-weight:600;cursor:pointer}
  .abtn2{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 14px;cursor:pointer;font:inherit}

  .modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:flex-start;justify-content:center;overflow:auto}
  .modal-ov.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:8vh;width:min(720px,94vw);position:relative}
  .modal h3{font-size:16px;margin-bottom:16px}
  .modal .x{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--faint);font-size:20px;cursor:pointer}
  .modal .x:hover{color:var(--ink)}
  .mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
  .mrow .ff label{display:block;color:var(--dim);font-size:11.5px;margin-bottom:4px}
  .mrow input,.mrow select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:inherit;font-size:13px;box-sizing:border-box}
  .toast{position:fixed;top:18px;right:18px;z-index:99;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--ok);border-radius:10px;padding:12px 18px;font-size:13px;opacity:0;transform:translateY(-8px);
    transition:all .25s;max-width:340px}
  .toast.show{opacity:1;transform:none}
  .toast.err{border-left-color:var(--bad)}
  .screen-prev{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:6px;display:block}
  .op-avg{font-weight:700}
  .loginbox{display:flex;flex-direction:column;gap:10px;max-width:320px}
  .loginbox input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:inherit;font-size:13px}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
  .gate.hide{display:none}
  .gate-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 38px;width:min(380px,92vw);text-align:center}
  .gate-card .logo{font-size:22px;font-weight:700;margin-bottom:4px}
  .gate-card .sub{color:var(--faint);font-size:12.5px;margin-bottom:22px}
  .gate-card input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:13.5px;margin-bottom:10px;box-sizing:border-box;text-align:center}
  .gate-card .abtn{width:100%}
  .gate-card .err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:6px}
  .draftmark{color:var(--warn);font-size:11px;font-weight:600}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="logo">Проверка смен</div>
    <div class="sub">вход по личному логину — увидишь только свои города</div>
    <input id="l-user" placeholder="Логин" autocomplete="username">
    <input id="l-pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="abtn" id="l-go">Войти</button>
    <div class="err" id="l-msg"></div>
  </div>
</div>
<div class="wrap">
  <div class="banner"><span class="dot-off" id="livedot"></span><span id="livetext">Загрузка…</span>
    <button id="addbtn" class="abtn2">＋ Смена</button>
    <button id="loginbtn" class="abtn2">🔑 Войти</button>
    <button id="refresh" style="margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px 14px;cursor:pointer;font:inherit">⟳ Обновить</button>
  </div>
  <div class="addform" id="addform">
    <div class="frow">
      <select id="a-city"><option>Томск</option><option>Новосибирск</option><option>Онлайн</option></select>
      <input id="a-prod" placeholder="Продюсер (фамилия)" list="prodlist">
      <datalist id="prodlist"></datalist>
      <input id="a-nick" placeholder="Ник оператора (CB)">
      <input id="a-opname" placeholder="Опер (ФИО)">
      <input id="a-model" placeholder="Модель">
    </div>
    <button class="abtn" id="a-save">Добавить смену</button>
    <span id="a-msg" style="color:var(--dim);font-size:12.5px;margin-left:10px"></span>
  </div>
  <header>
    <h1>Проверка смен — дашборд</h1>
    <span class="week" id="weeklabel"></span>
    <span class="sub" id="updated"></span>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <div class="modal-ov" id="addmodal">
    <div class="modal">
      <button class="x" id="add-x">✕</button>
      <h3>＋ Новая смена</h3>
      <div class="mrow">
        <div class="ff"><label>Город</label><select id="a-city"><option>Томск</option><option>Новосибирск</option><option>Онлайн</option></select></div>
        <div class="ff"><label>Продюсер</label><select id="a-prod"></select></div>
      </div>
      <div class="mrow" id="a-newrow" style="display:none">
        <div class="ff"><label>Имя нового продюсера</label><input id="a-prod-new" placeholder="Фамилия"></div>
      </div>
      <div class="mrow">
        <div class="ff"><label>Никнейм CB</label><input id="a-nick" placeholder="никнейм оператора на CB"></div>
        <div class="ff"><label>Опер (фамилия)</label><input id="a-opname" placeholder="фамилия оператора"></div>
        <div class="ff"><label>Модель (фамилия)</label><input id="a-model" placeholder="фамилия модели"></div>
      </div>
      <button class="abtn" id="a-save">Добавить смену</button>
      <span id="a-msg" style="color:var(--dim);font-size:12.5px;margin-left:10px"></span>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <p class="note">Данные: Google-таблица «продюсеры» (приватная) → Apps Script (доступ только по ключу) → этот дашборд. Обновление каждые 5 минут.</p>
</div>

<script>
// ================== НАСТРОЙКИ ==================
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbxmWb1EW8be1Y-6WFMM_ZIRFN7lt4c06GJoamKwxOloWR4xg4XyYZJmFwbbkGQ5OZ3q/exec",
  API_KEY: "",
  REFRESH_MIN: 5
};
(function(){
  const p = new URLSearchParams(location.search).get("key");
  if (p) localStorage.setItem("dash_key", p);
})();
CONFIG.API_KEY = localStorage.getItem("dash_key") || "";

// сессия: user, pass, edit, cities
const AUTH = {
  user: localStorage.getItem("dash_user") || "",
  pass: localStorage.getItem("dash_pass") || "",
  edit: localStorage.getItem("dash_edit") === "1",
  cities: JSON.parse(localStorage.getItem("dash_cities") || "null") || [],
  ok(){ return !!(this.user && this.pass && this.cities.length); },
  set(u,p,edit,cities){ this.user=u; this.pass=p; this.edit=edit; this.cities=cities;
    localStorage.setItem("dash_user",u); localStorage.setItem("dash_pass",p);
    localStorage.setItem("dash_edit",edit?"1":"0"); localStorage.setItem("dash_cities",JSON.stringify(cities)); },
  clear(){ ["dash_user","dash_pass","dash_edit","dash_cities"].forEach(k=>localStorage.removeItem(k));
    this.user=""; this.pass=""; this.edit=false; this.cities=[]; },
  canCity(c){ return this.cities.includes("all") || this.cities.includes(c); }
};

const CATS = ["Работа с ОКО","Общение с моделью","Общение с мемберами","Работа с голами","Шоу / плейлист","Работа с сайтами / раскладка","Кадр / картинка","Комната"];
const FIELDCODES = ["oko","model","membrs","goly","show","sites","kadr","room"];
const PRODUCERS = {
  "Томск": ["Фуад","Минько","Дащинский","Кравчук","Соколов","Валов"],
  "Новосибирск": ["Иванов","Пирожков","Козлов","Фаткулин","Васильченко","Пышков","Глушков","Белых","Бологов","Феоктистов","Черников"],
  "Онлайн": ["Калдузов","Салихов","Околот","Шевченко","Гаврилов","Неустроев","Капитонов","Замирбек"]
};
const OK_RE = new RegExp("(^|[\\s,.!?])(все хорошо|все отлично|все нравится|работа есть|работает хорошо|нравится|молодец|старается|отлично|активное|хорошая|хорошо|поддерживает|вовлечена|сработаны)", "i");
const NEG_RE = new RegExp("\\b(не|нет)\\s", "i");

const state = { tab:"Обзор", producer:"", onlyBad:false, search:"", lastView:[], rows:[], open:{} };

function tabs(){
  const cities = AUTH.cities.includes("all")
    ? ["Томск","Новосибирск","Онлайн"]
    : AUTH.cities.filter(c=>CITY_ORDER.includes(c));
  return ["Обзор"].concat(cities).concat(["Операторы"]);
}
const CITY_ORDER = ["Томск","Новосибирск","Онлайн"];

function catState(t){
  const s = (t||"").trim();
  if (!s) return null;
  if (s.charAt(0) === "✅") return "ok";
  if (OK_RE.test(s) && !NEG_RE.test(s)) return "ok";
  return "bad";
}
function rowStats(r){
  const st = r.cats.map(catState);
  const ok = st.filter(x=>x==="ok").length;
  const bad = st.filter(x=>x==="bad").length;
  const evalN = st.filter(x=>x!==null).length;
  let score = null, verdict = "";
  if (evalN > 0){
    score = ok;
    verdict = bad === 0 ? "норма" : bad <= 2 ? "замечание" : "критично";
    if (r.verdict && r.verdict !== "—") verdict = r.verdict;
    if (r.score && r.score.indexOf("/8") >= 0) score = parseInt(r.score) || 0;
  }
  return {st, ok, bad, score, verdict};
}
const scoreCls = n => n>=6 ? "score-ok" : n>=3 ? "score-warn" : "score-bad";
const chipCls = {"норма":"c-ok","замечание":"c-warn","критично":"c-bad"};
function esc(s){ return (s||"").split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;"); }
function rowsOf(tab){ return tab==="Обзор"||tab==="Операторы" ? state.rows : state.rows.filter(r=>r.city===tab); }

// ---------- черновики ----------
const dKey = r => "draft:" + r._sheet + ":" + r._row;
function getDraft(r){ try{ return JSON.parse(localStorage.getItem(dKey(r)) || "null"); }catch(e){ return null; } }
function setDraft(r, d){ localStorage.setItem(dKey(r), JSON.stringify(d)); }
function clearDraft(r){ localStorage.removeItem(dKey(r)); }
function draftVal(r, j){ const d = getDraft(r); return d && d["f"+j] !== undefined ? d["f"+j] : (r.cats[j]||""); }
function draftIsDirty(r){ return !!getDraft(r); }
function rowDirty(key){
  const x = state.lastView[key]; if (!x) return false;
  for (let j=0;j<8;j++){
    const el = document.getElementById("ed"+key+"_"+j);
    if (el && el.value !== (x.r.cats[j]||"")) return true;
  }
  const c = document.getElementById("ed"+key+"_comment");
  if (c && c.value !== (x.r.obs||"")) return true;
  const s = document.getElementById("ed"+key+"_screen");
  if (s && s.value.trim() !== (x.r.screen||"")) return true;
  return false;
}
function anyDirty(){
  return [...document.querySelectorAll("tr.detail.open")].some(d=>rowDirty(d.dataset.d));
}

let toastTimer = null;
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className = "toast", 3500);
}
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
document.addEventListener("click", e=>{
  const ov = document.getElementById("addmodal");
  if (ov && ov.classList.contains("show") && e.target === ov) closeModal("addmodal");
});
document.addEventListener("keydown", e=>{
  if (e.key === "Escape") closeModal("addmodal");
});

function updateLoginBtn(){
  document.getElementById("loginbtn").textContent = AUTH.ok ? "👤 " + AUTH.user + " · сменить вход" : "🔑 Войти";
}

function render(){
  document.getElementById("tabs").innerHTML = tabs().map(c=>{
    const n = rowsOf(c).length;
    return `<button class="tab ${state.tab===c?"on":""}" data-t="${c}">${c}<span class="cnt">${n||""}</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.t));

  const rows = rowsOf(state.tab);
  const st = rows.map(rowStats);
  const withScore = st.filter(x=>x.score!==null);
  document.getElementById("weeklabel").textContent = [...new Set(rows.map(r=>r.week).filter(Boolean))].join(" · ") || "—";

  if (state.tab==="Операторы"){ renderOperators(rows, st); return; }

  const prods = [...new Set(rows.map(r=>r.producer).filter(Boolean))].sort();
  const sel = `<select id="f-prod"><option value="">все продюсеры</option>${prods.map(p=>`<option ${state.producer===p?"selected":""}>${esc(p)}</option>`).join("")}</select>`;

  document.getElementById("content").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="n">${withScore.length}</div><div class="l">смен проверено</div></div>
      <div class="tile"><div class="n" style="color:var(--faint)">${rows.length - withScore.length}</div><div class="l">не проверено</div></div>
      <div class="tile ok"><div class="n">${withScore.filter(x=>x.verdict==="норма").length}</div><div class="l">в норме</div></div>
      <div class="tile warn"><div class="n">${withScore.filter(x=>x.verdict==="замечание").length}</div><div class="l">есть замечания</div></div>
      <div class="tile bad"><div class="n">${withScore.filter(x=>x.verdict==="критично").length}</div><div class="l">критично</div></div>
      <div class="tile"><div class="n">${withScore.length?Math.round(withScore.reduce((a,x)=>a+x.score,0)/withScore.length*12.5)+"%":"–"}</div><div class="l">средняя оценка</div></div>
    </div>
    <div class="grid">
      <div class="card"><h2>Топ проблем по категориям</h2><div id="cats"></div></div>
      ${state.tab==="Обзор" ? '<div class="card"><h2>Города: норма / замечание / критично</h2><div class="stacks" id="stacks"></div><div class="lgt"><span><i class="seg-ok"></i>норма</span><span><i class="seg-warn"></i>замечание</span><span><i class="seg-bad"></i>критично</span></div></div>'
                            : '<div class="card"><h2>Вердикты</h2><div id="donut"></div></div>'}
    </div>
    <div class="card">
      <h2>Смены <span style="color:var(--faint);font-size:12px;font-weight:400">— клик по строке: детали${AUTH.edit?" и редактирование":""}</span></h2>
      <div class="filters">${sel}<input id="f-search" placeholder="поиск по оперу, модели, тексту…" style="width:240px" value="${esc(state.search)}">
        <label><input type="checkbox" id="f-bad" ${state.onlyBad?"checked":""}> только проблемные</label>
        <span class="count" id="f-count"></span>
      </div>
      <div id="table"></div>
    </div>`;
  document.getElementById("f-prod").onchange = e=>{state.producer=e.target.value;render();};
  document.getElementById("f-bad").onchange = e=>{state.onlyBad=e.target.checked;render();};
  const fs=document.getElementById("f-search");
  fs.oninput = e=>{state.search=e.target.value;render();const f2=document.getElementById("f-search");f2.focus();f2.setSelectionRange(f2.value.length,f2.value.length);};

  const catCounts = CATS.map((n,i)=>({n, c: rows.filter(r=>rowStats(r).st[i]==="bad").length}));
  catCounts.sort((a,b)=>b.c-a.c);
  const mx = Math.max(1,...catCounts.map(x=>x.c));
  document.getElementById("cats").innerHTML = catCounts.map(x=>
    `<div class="bar-row"><span class="lbl">${x.n}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.c/mx*100)}%;background:${x.c>=mx*0.8?"var(--bad)":x.c>=mx*0.4?"#d67f42":"var(--ok)"}"></div></div><span class="val">${x.c}</span></div>`).join("");

  if (state.tab==="Обзор"){
    const cities = tabs().filter(c=>c!=="Обзор"&&c!=="Операторы");
    const counts = cities.map(c=>({
      c,
      ok: st.filter((x,i)=>rows[i].city===c&&x.verdict==="норма").length,
      warn: st.filter((x,i)=>rows[i].city===c&&x.verdict==="замечание").length,
      bad: st.filter((x,i)=>rows[i].city===c&&x.verdict==="критично").length
    }));
    const tot = Math.max(1,...counts.map(x=>x.ok+x.warn+x.bad));
    document.getElementById("stacks").innerHTML = counts.map(x=>{
      const h = v=>Math.round(v/tot*100)+"%";
      return `<div class="stcol"><span class="sum">${x.ok+x.warn+x.bad}</span><div class="stack">
        <div class="seg-bad" style="height:${h(x.bad)}"></div><div class="seg-warn" style="height:${h(x.warn)}"></div><div class="seg-ok" style="height:${h(x.ok)}"></div></div><span>${x.c==="Новосибирск"?"НСК":x.c}</span></div>`;
    }).join("");
  } else {
    const segs = ["критично","замечание","норма"].map(v=>({v,n:withScore.filter(x=>x.verdict===v).length,
      color:v==="норма"?"var(--ok)":v==="замечание"?"var(--warn)":"var(--bad)"})).filter(x=>x.n);
    const tot = segs.reduce((a,s)=>a+s.n,0)||1;
    let acc=0;
    const svg = `<svg class="dyn" width="190" height="190" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="15.9" fill="none" stroke="#22262d" stroke-width="6"></circle>
      ${segs.map(s=>{const f=s.n/tot*100;const o=acc;acc+=f;
        return `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${s.color}" stroke-width="6" stroke-dasharray="${f.toFixed(2)} ${(100-f).toFixed(2)}" stroke-dashoffset="${(-o).toFixed(2)}" transform="rotate(-90 21 21)"></circle>`;}).join("")}
      <text x="21" y="20.5" text-anchor="middle" fill="#e8eaf0" font-size="7" font-weight="700">${tot}</text>
      <text x="21" y="26.5" text-anchor="middle" fill="#6b7280" font-size="3.2">смен</text></svg>`;
    document.getElementById("donut").innerHTML = svg +
      `<div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--dim)">${segs.map(s=>`<div><span class="dot" style="background:${s.color}"></span> ${s.v}: <b style="color:var(--ink)">${s.n}</b></div>`).join("")}</div>`;
  }

  let view = rows.map((r,i)=>({r, s:st[i]}));
  if (state.producer) view = view.filter(x=>x.r.producer===state.producer);
  if (state.onlyBad) view = view.filter(x=>x.s.verdict==="критично" || x.s.verdict==="замечание");
  if (state.search){ const q=state.search.toLowerCase(); view=view.filter(x=>[x.r.producer,x.r.opName,x.r.opNick,x.r.model,x.r.obs].concat(x.r.cats).join(" ").toLowerCase().includes(q)); }
  view.sort((a,b)=>(a.s.score===null?99:a.s.score)-(b.s.score===null?99:b.s.score));
  state.lastView = view;
  document.getElementById("f-count").textContent = "показано " + view.length + " из " + rows.length;

  document.getElementById("table").innerHTML = view.length ? `<table>
    <thead><tr><th>Продюсер</th><th>Опер</th><th>Модель</th>${state.tab==="Обзор"?"<th>Город</th>":""}<th>Оценка</th><th>Вердикт</th><th></th></tr></thead><tbody>${
    view.map((x,key)=>{
      const dr = getDraft(x.r);
      const readDet = CATS.map((n,j)=>{
        const t = (x.r.cats[j]||"").trim();
        if (!t) return "";
        const mark = x.s.st[j]==="ok" ? "✅" : x.s.st[j]==="bad" ? "❌" : "·";
        return `<div class="drow"><b>${mark} ${n}</b><span>${esc(t)}</span></div>`;
      }).join("") + (x.r.obs ? `<div class="drow"><b>💬 Доп. комментарий</b><span>${esc(x.r.obs)}</span></div>` : "");
      const editDet = CATS.map((n,j)=>{
        const val = dr && dr["f"+j] !== undefined ? dr["f"+j] : (x.r.cats[j]||"");
        return `<div class="f"><b>${n}<span><button class="qbtn" data-ta="ed${key}_${j}" data-v="✅ всё хорошо">✅</button> <button class="qbtn" data-ta="ed${key}_${j}" data-v="">✕</button></span></b><textarea id="ed${key}_${j}" data-j="${j}">${esc(val)}</textarea></div>`;
      }).join("") + `<div class="f" style="grid-column:1/-1"><b>💬 Доп. комментарий / наблюдение</b><textarea id="ed${key}_comment">${esc(dr && dr.comment !== undefined ? dr.comment : (x.r.obs||""))}</textarea></div>
        <div class="f"><b>📸 Ссылка на скрин смены</b><input id="ed${key}_screen" style="width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px;box-sizing:border-box" value="${esc(dr && dr.screen !== undefined ? dr.screen : (x.r.screen||""))}" placeholder="https://…"></div>`;
      const inner = AUTH.edit ? `<div class="edit-grid">${editDet}</div>
        <button class="savebtn" id="sv${key}">💾 Сохранить в таблицу</button>
        <span id="svmsg${key}" style="color:var(--dim);font-size:12.5px;margin-left:12px"></span>`
        : `<div class="dgrid">${readDet}</div>` +
          (x.r.screen ? `<img class="screen-prev" src="${esc(x.r.screen)}" alt="скрин смены">` : "");
      const cityCell = state.tab==="Обзор" ? `<td style="color:var(--dim)">${esc(x.r.city)}</td>` : "";
      const draftMark = AUTH.edit && dr ? ' <span class="draftmark">черновик</span>' : "";
      return `<tr class="r" data-i="${key}"><td>${esc(x.r.producer||"—")}${draftMark}${isFresh(x.r)?' <span title="обновлено: '+esc(x.r.updated)+'" style="color:var(--accent)">⏱</span>':""}</td><td>${esc(x.r.opName||x.r.opNick||"")}${x.r.opNick&&x.r.opName?` <span style="color:var(--faint);font-size:11px">(${esc(x.r.opNick)})</span>`:""}</td><td>${esc(x.r.model||"")}</td>${cityCell}<td class="${scoreCls(x.s.score===null?0:x.s.score)}">${x.s.score!==null?x.s.score+"/8":"–"}</td><td>${x.s.verdict?`<span class="chip ${chipCls[x.s.verdict]}">${x.s.verdict}</span>`:'<span class="chip c-warn" style="opacity:.55">не проверено</span>'}</td><td style="color:var(--accent);font-weight:700">✎</td></tr>
      <tr class="detail" data-d="${key}"><td colspan="7"><div class="detail-in">${inner}</div></td></tr>`;
    }).join("")}</tbody></table>` : `<div class="empty">Нет данных по фильтру</div>`;

  document.querySelectorAll("tr.r").forEach(tr=>tr.onclick=()=>{
    const d = document.querySelector(`tr.detail[data-d="${tr.dataset.i}"]`);
    if (d.classList.contains("open") && rowDirty(tr.dataset.i) && !confirm("Есть несохранённые правки (они сохранены в черновик и не пропадут). Закрыть?")) return;
    d.classList.toggle("open");
    if (d.classList.contains("open")) d.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
  document.querySelectorAll(".qbtn").forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    document.getElementById(b.dataset.ta).value = b.dataset.v;
  });
  document.querySelectorAll(".detail textarea, .detail input").forEach(el=>{
    el.oninput = function(){
      const det = this.closest("tr.detail");
      if (!det) return;
      const x = state.lastView[det.dataset.d]; if (!x) return;
      const d = getDraft(x.r) || {};
      CATS.forEach((n,j)=>{ const ta = document.getElementById("ed"+det.dataset.d+"_"+j); if (ta) d["f"+j] = ta.value; });
      const c = document.getElementById("ed"+det.dataset.d+"_comment"); if (c) d.comment = c.value;
      const s = document.getElementById("ed"+det.dataset.d+"_screen"); if (s) d.screen = s.value;
      setDraft(x.r, d);
    };
  });
  view.forEach((x,key)=>{
    const btn = document.getElementById("sv"+key);
    if (btn) btn.onclick = ()=>saveRow(x, key);
  });
}

function switchTab(t){
  if (state.tab !== t && anyDirty() && !confirm("Есть несохранённые правки. Правки уже в черновике и не пропадут. Переключить вкладку?")) return;
  state.tab = t; state.open = {}; render();
}

// ---------- «Операторы» ----------
function renderOperators(rows, st){
  const map = {};
  rows.forEach((r,i)=>{
    const name = (r.opName || r.opNick || "").trim() || "—";
    const s = st[i];
    if (!map[name]) map[name] = {checks:0, sum:0, crit:0, cities:new Set(), prods:new Set(), rows:[]};
    const o = map[name];
    o.checks++;
    if (s.score!==null){ o.sum += s.score; }
    if (s.verdict==="критично") o.crit++;
    o.cities.add(r.city); o.prods.add(r.producer||"—");
    o.rows.push({r, s});
  });
  const ops = Object.entries(map).map(([name,o])=>({
    name, checks:o.checks, avg: o.sum>0 ? o.sum/o.checks : null,
    crit:o.crit, cities:[...o.cities], prods:[...o.prods], rows:o.rows
  })).sort((a,b)=>(b.avg??-1)-(a.avg??-1));

  document.getElementById("content").innerHTML = `
    <div class="card"><h2>Рейтинг операторов <span style="color:var(--faint);font-size:12px;font-weight:400">— клик по оперу: вся история проверок</span></h2>
      ${ops.length ? `<table><thead><tr><th>Оператор</th><th>Ник CB</th><th>Проверок</th><th>Средняя оценка</th><th>Критичных</th><th>Города</th><th>Продюсеры</th></tr></thead><tbody>${
        ops.map((o,i)=>{
          const nick = o.rows.find(x=>x.r.opNick);
          return `<tr class="op" data-i="${i}"><td style="font-weight:600">${esc(o.name)}</td><td style="color:var(--faint)">${esc(nick?nick.r.opNick:"")}</td><td>${o.checks}</td><td class="${o.avg!==null?scoreCls(o.avg):""}">${o.avg!==null?Math.round(o.avg*12.5)+"% ("+o.avg.toFixed(1)+"/8)":"–"}</td><td>${o.crit>0?`<span style="color:var(--bad);font-weight:700">${o.crit}</span>`:"0"}</td><td style="color:var(--dim)">${o.cities.map(c=>c==="Новосибирск"?"НСК":c).join(", ")}</td><td style="color:var(--dim)">${o.prods.map(esc).join(", ")}</td></tr>
          <tr class="opdet" data-o="${i}" style="display:none"><td colspan="7"><div style="padding:10px 6px">${
            o.rows.map(x=>`<div class="drow"><b>${esc(x.r.producer||"—")} · ${esc(x.r.model||"—")} · ${esc(x.r.city)} · ${x.s.verdict?x.s.verdict:"не проверено"}</b><span>${esc(x.r.cats.map((c,j)=>c?("["+CATS[j]+"] "+c):"").filter(Boolean).join("  |  ") || (x.r.obs||""))}</span></div>`).join("")
          }</div></td></tr>`;
        }).join("")}</tbody></table>` : `<div class="empty">Нет данных</div>`}
    </div>`;
  document.querySelectorAll("tr.op").forEach(tr=>tr.onclick=()=>{
    const d = document.querySelector(`tr.opdet[data-o="${tr.dataset.i}"]`);
    d.style.display = d.style.display==="none" ? "" : "none";
  });
}

// ---------- связь с таблицей ----------
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb="__dashcb_"+Math.random().toString(36).slice(2);
    window[cb]=d=>{resolve(d);cleanup();};
    const q = new URLSearchParams(params);
    q.set("callback", cb); q.set("key", CONFIG.API_KEY);
    const s=document.createElement("script");
    s.src=CONFIG.API_URL+"?"+q.toString();
    s.onerror=()=>{reject(new Error("не удалось связаться с таблицей"));cleanup();};
    function cleanup(){delete window[cb];s.remove();}
    document.head.appendChild(s);
  });
}

async function saveRow(x, key){
  if (!AUTH.edit){ toast("Править может только редактор", true); return; }
  const btn = document.getElementById("sv"+key);
  const changes = [];
  for (let j=0;j<8;j++){
    const val = document.getElementById("ed"+key+"_"+j).value;
    if (val !== (x.r.cats[j]||"")) changes.push([FIELDCODES[j], val]);
  }
  const com = document.getElementById("ed"+key+"_comment").value;
  if (com !== (x.r.obs||"")) changes.push(["comment", com]);
  const scr = document.getElementById("ed"+key+"_screen").value.trim();
  if (scr !== (x.r.screen||"")) changes.push(["screen", scr]);
  if (!changes.length){ toast("Изменений нет", true); return; }
  btn.disabled = true;
  try {
    const params = { action:"save", sheet: x.r._sheet, row: String(x.r._row), user: AUTH.user, pass: AUTH.pass };
    changes.forEach((c,i)=>{ params["f"+(i+1)] = c[0]; params["v"+(i+1)] = c[1]; });
    const res = await jsonp(params);
    if (res.error) throw new Error(res.error);
    clearDraft(x.r);
    toast("✔ Сохранено в таблицу (" + res.saved + " полей)");
    setTimeout(load, 800);
  } catch(e){
    toast("Ошибка: " + e.message, true);
  } finally { btn.disabled = false; }
}

// ---------- форма новой смены ----------
function updateProdList(){
  const city = document.getElementById("a-city").value;
  const list = [...new Set([...(PRODUCERS[city]||[]), ...state.rows.filter(r=>r.city===city).map(r=>r.producer).filter(Boolean)])];
  const sel = document.getElementById("a-prod");
  sel.innerHTML = list.map(p=>`<option>${esc(p)}</option>`).join("") + `<option value="__new">➕ Другой продюсер…</option>`;
  document.getElementById("a-newrow").style.display = "none";
  document.getElementById("a-prod-new").value = "";
}
document.getElementById("a-city").onchange = updateProdList;
document.getElementById("a-prod").onchange = e=>{
  document.getElementById("a-newrow").style.display = e.target.value==="__new" ? "" : "none";
};
document.getElementById("addbtn").onclick = ()=>{ updateProdList(); openModal("addmodal"); };
document.getElementById("add-x").onclick = ()=>closeModal("addmodal");
document.getElementById("a-save").onclick = async ()=>{
  if (!AUTH.edit){ toast("Добавлять смены может только редактор", true); return; }
  const msg = document.getElementById("a-msg");
  const city = document.getElementById("a-city").value;
  const prodSel = document.getElementById("a-prod").value;
  const prod = prodSel==="__new" ? document.getElementById("a-prod-new").value.trim() : prodSel;
  const nick = document.getElementById("a-nick").value.trim();
  const opname = document.getElementById("a-opname").value.trim();
  const model = document.getElementById("a-model").value.trim();
  if (!prod){ msg.textContent = "Укажи продюсера"; return; }
  const any = state.rows.find(r=>r.city===city);
  if (!any){ msg.textContent = "На листе " + city + " пока нет строк — создай блок продюсера в таблице"; return; }
  msg.textContent = "Добавляю…";
  try {
    const res = await jsonp({ action:"add", sheet: any._sheet, producer: prod, nick: nick, opname: opname, model: model, user: AUTH.user, pass: AUTH.pass });
    if (res.error) throw new Error(res.error);
    closeModal("addmodal");
    toast("✔ Смена добавлена в " + city + " (строка " + res.row + ")");
    ["a-nick","a-opname","a-model","a-prod-new"].forEach(id=>document.getElementById(id).value="");
    setTimeout(load, 800);
  } catch(e){ msg.textContent = "Ошибка: " + e.message; }
};

// ---------- вход ----------
function showGate(){
  document.getElementById("gate").classList.remove("hide");
  document.getElementById("l-pass").value = "";
  document.getElementById("l-msg").textContent = "";
  setTimeout(()=>document.getElementById("l-user").focus(), 100);
}
function hideGate(){ document.getElementById("gate").classList.add("hide"); }
document.getElementById("loginbtn").onclick = ()=>{
  if (AUTH.ok && anyDirty() && !confirm("Есть несохранённые правки (черновик сохранён). Сменить вход?")) return;
  AUTH.clear(); showGate();
};
document.getElementById("l-go").onclick = doLogin;
document.getElementById("l-pass").onkeydown = e=>{ if (e.key==="Enter") doLogin(); };
async function doLogin(){
  const u = document.getElementById("l-user").value.trim();
  const p = document.getElementById("l-pass").value;
  if (!u || !p){ document.getElementById("l-msg").textContent = "Введи логин и пароль"; return; }
  document.getElementById("l-msg").textContent = "Проверяю…";
  try {
    const res = await jsonp({ action:"check", user:u, pass:p });
    if (res.error || !res.ok){ document.getElementById("l-msg").textContent = res.error || "Неверный логин или пароль"; return; }
    AUTH.set(u, p, !!res.editor, res.cities || []);
    hideGate();
    updateLoginBtn();
    toast("✔ Вход: " + u + (AUTH.edit ? " (редактор)" : " · города: " + (AUTH.cities.includes("all")?"все":AUTH.cities.join(", "))));
    load();
  } catch(e){ document.getElementById("l-msg").textContent = "Не удалось проверить — попробуй ещё раз"; }
}

function isFresh(r){
  if (!r.updated) return false;
  const today = new Date().toLocaleDateString("ru-RU").slice(0,5);
  return r.updated.slice(0,5) === today;
}

async function load(){
  if (!AUTH.ok){ showGate(); return; }
  if (!CONFIG.API_KEY){
    const k=prompt("Введи ключ доступа к дашборду:");
    if(k){localStorage.setItem("dash_key",k);CONFIG.API_KEY=k;}
    else{ return; }
  }
  const dot=document.getElementById("livedot"),txt=document.getElementById("livetext");
  try{
    const j=await jsonp({action:"read", user:AUTH.user, pass:AUTH.pass});
    if(j.error)throw new Error(j.error);
    state.rows=(j.rows||[]).filter(r=>r.opName||r.model||r.cats.some(c=>(c||"").trim()));
    dot.className="dot-live";
    txt.textContent="Живые данные · обновлено "+new Date().toLocaleTimeString("ru-RU")+(AUTH.edit?" · редактор":" · просмотр");
    document.getElementById("updated").textContent="источник: таблица «продюсеры»";
    updateLoginBtn();
    render();
    if (document.getElementById("a-prod")) updateProdList();
  }catch(e){
    dot.className="dot-off";
    txt.textContent="Ошибка загрузки: "+e.message+". Возможно, нужно войти в Google-аккаунт в этом браузере.";
  }
}
document.getElementById("refresh").onclick=()=>{
  if (anyDirty() && !confirm("Есть несохранённые правки (черновик сохранён). Обновить данные?")) return;
  load();
};
window.addEventListener("beforeunload", e=>{
  if (anyDirty()){ e.preventDefault(); e.returnValue = ""; }
});
load();
setInterval(()=>{ if (AUTH.ok && !anyDirty()) load(); }, CONFIG.REFRESH_MIN*60*1000);
</script>
</body>
